name: Build

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run package:offline
      - uses: actions/upload-artifact@v4
        with:
          name: wenjian-offline-windows
          path: offline-dist
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: wenjian-offline-windows
          path: release-package
      - name: Create release archive
        shell: pwsh
        run: Compress-Archive -Path 'release-package\*' -DestinationPath "wenjian-$env:GITHUB_REF_NAME-windows.zip" -CompressionLevel Optimal
      - name: Publish GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$env:GITHUB_REF_NAME" "wenjian-$env:GITHUB_REF_NAME-windows.zip" --repo "$env:GITHUB_REPOSITORY" --title "Wenjian $env:GITHUB_REF_NAME" --generate-notes
