name: Build

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run package:offline
      - uses: actions/upload-artifact@v4
        with:
          name: wenjian-offline-windows
          path: offline-dist
          if-no-files-found: error
